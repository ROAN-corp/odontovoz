name: Publicar funciones de la Autogestión por WhatsApp
# Sube las funciones de supabase/functions a Supabase cada vez que cambian (y a mano desde Actions).
# Necesita el secreto SUPABASE_ACCESS_TOKEN del repositorio (un token personal de supabase.com › Account › Access Tokens).
# Sin ese secreto no hace nada. Los secretos de las funciones (Meta, IA) se cargan aparte en el panel de Supabase.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'tests/push/**', 'scripts/build-wa.js', 'scripts/wa-menu.js', '.github/workflows/functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: hcppfvioiaaejayzzhpa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar que wa-sim esté al día y pasen las pruebas
        run: |
          node scripts/build-wa.js
          git diff --exit-code supabase/functions src/app52.js || (echo "::error::Corré node scripts/build-wa.js y subí los archivos generados" && exit 1)
          cd tests/wa
          for f in menu.test.mjs testmenu.mjs test.mjs testsim.mjs; do node --experimental-strip-types --no-warnings $f | tee /tmp/$f.out; grep -q "todo bien" /tmp/$f.out; done
          cd ../..
          node --experimental-strip-types --no-warnings tests/push/push.test.mjs | tee /tmp/push.out; grep -q "todo bien" /tmp/push.out
      - name: Publicar en Supabase
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          npx --yes supabase@2 functions deploy wa-sim --project-ref "$REF" --use-api
          npx --yes supabase@2 functions deploy wa-send --project-ref "$REF" --use-api
          npx --yes supabase@2 functions deploy wa-webhook --project-ref "$REF" --use-api --no-verify-jwt
          npx --yes supabase@2 functions deploy wa-cron --project-ref "$REF" --use-api --no-verify-jwt
          npx --yes supabase@2 functions deploy push-hook --project-ref "$REF" --use-api --no-verify-jwt
      - name: Aviso
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "::notice::Falta el secreto SUPABASE_ACCESS_TOKEN; las funciones no se publicaron."
