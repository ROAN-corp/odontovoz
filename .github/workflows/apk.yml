name: Generar APK de OdontoVoz

# Se ejecuta solo cada vez que se sube un cambio a la rama main,
# y también a mano desde la pestaña "Actions" → "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar Android SDK (ya viene instalado en el servidor de GitHub)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" | tail -5
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" | tail -5

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Tipografías locales (sin Google Fonts)
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps @fontsource/bricolage-grotesque@5 @fontsource/ibm-plex-mono@5 @fontsource/instrument-sans@5 @fontsource/atkinson-hyperlegible@5 @fontsource/schibsted-grotesk@5 || echo 'sin tipografías locales'

      - name: Armar la app web (www)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/prepare-www.js

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Ícono y pantalla de inicio
        run: npx capacitor-assets generate --android

      - name: Permisos (micrófono) y versión
        run: node scripts/patch-android.js

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Clave de firma fija (para actualizar sin desinstalar)
        uses: actions/cache@v4
        with:
          path: ~/ov-keystore
          key: odontovoz-keystore-v2

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Firmar el APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p dist ~/ov-keystore
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
          else
            echo "::warning::Sin clave propia (secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD): se usa la clave guardada en el caché de GitHub."
            if [ ! -f ~/ov-keystore/ov.jks ]; then
              keytool -genkeypair -keystore ~/ov-keystore/ov.jks -alias odontovoz -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass odontovoz-cache -keypass odontovoz-cache -dname "CN=OdontoVoz, O=OdontoVoz, C=AR"
            fi
            cp ~/ov-keystore/ov.jks ks.jks; KS_PASS=odontovoz-cache
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-key-alias odontovoz --ks-pass env:KS_PASS --key-pass env:KS_PASS --out dist/OdontoVoz.apk aligned.apk
          "$BT/apksigner" verify --print-certs dist/OdontoVoz.apk | grep -i "SHA-256"
          rm -f ks.jks aligned.apk
          ls -la dist

      - name: Guardar el APK en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: OdontoVoz-apk
          path: dist/OdontoVoz.apk

      - name: Publicar para descargar desde el teléfono
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.35.${{ github.run_number }}
          name: OdontoVoz 1.35 (compilación ${{ github.run_number }})
          body: |
            Teléfono: descargá **OdontoVoz.apk** e instalalo.
            PC: descargá **OdontoVoz-web.html** y abrilo con doble clic (Chrome o Edge).
            Si Android lo pide, permití "instalar apps de orígenes desconocidos" para el navegador.
            Para actualizar, instalá el APK nuevo encima del anterior: los datos se conservan.
          files: |
            dist/OdontoVoz.apk
            dist/OdontoVoz-web.html
          make_latest: true
