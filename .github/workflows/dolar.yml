name: Dólar oficial para los precios en pesos
on:
  schedule:
    - cron: '7 11 * * 1'   # todos los lunes, 8:07 de Argentina
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  dolar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bajar el dólar oficial
        run: node scripts/dolar.mjs sitio/dolar.json
      - name: Guardar si cambió
        run: |
          git config user.name "OdontoVoz dólar"; git config user.email "somosroan@gmail.com"
          git add sitio/dolar.json
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Dólar oficial $(date +%Y-%m-%d)" && git push
            gh workflow run web.yml --ref main   # publicar la web con el dólar nuevo
          fi
        env:
          GH_TOKEN: ${{ github.token }}
