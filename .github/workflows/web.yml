name: Publicar OdontoVoz como página web

# Publica en GitHub Pages: la página de OdontoVoz en https://USUARIO.github.io/REPOSITORIO/ y la app en .../app/.
# Desde esa dirección se instala en el teléfono con Chrome ("Agregar a la pantalla de inicio")
# y el dictado por voz funciona con el reconocimiento de Chrome.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar jsPDF
        run: npm install --no-audit --no-fund --ignore-scripts jspdf@2.5.1 @fontsource/bricolage-grotesque@5 @fontsource/ibm-plex-mono@5 @fontsource/instrument-sans@5 @fontsource/atkinson-hyperlegible@5 @fontsource/schibsted-grotesk@5
      - name: Armar la app web (www)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/prepare-www.js
      - name: Armar el sitio (página pública + app en /app)
        run: node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
