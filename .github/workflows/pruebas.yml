name: Pruebas

# Corre las pruebas en cada subida a main y en cada pedido de cambios, así un error se ve antes de que llegue a los clientes.
# Revisa: versiones iguales en todos lados, index.html al día con src/, pantallas sin errores ni botones sin acción,
# las funciones principales (consentimientos, alquileres, Implantes, Endodoncia, Escaneos 3D…), la voz y los avisos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar lo necesario
        run: |
          npm install --no-save playwright jspdf@2.5.1
          npx playwright install --with-deps chromium
      - name: Voz
        run: |
          node tests/ovcmd.test.js
          node tests/ovcmd.charla.test.js
      - name: Avisos al teléfono
        run: node --experimental-strip-types --no-warnings tests/push/push.test.mjs
      - name: Pantallas y funciones
        run: node tests/ui/humo.js /tmp/ov-humo
      - name: Seguridad de textos, plata y panel de administración
        run: |
          node tests/ui/xss.js
          node tests/ui/dinero.js
          node tests/ui/admin.js

  # Los SQL de Supabase: se aplican todos en orden en una base común, se vuelve a correr cada uno solo y no tiene que cambiar nada
  # (así volver a correr un archivo viejo no pisa lo nuevo). Ver docs/SQL.md.
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cada función y regla vieja está protegida
        run: |
          python3 scripts/guardar-sql.py
          git diff --exit-code supabase/ || (echo "::error::Corré python3 scripts/guardar-sql.py y subí los archivos cambiados" && exit 1)
      - name: Aplicar todos los SQL y volver a correr cada uno
        run: bash tests/sql/probar.sh
